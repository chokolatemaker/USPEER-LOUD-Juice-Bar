<!-- LOUD JUICE BAR sensor prototype v0.5.1 | 2026-10-06 -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#111827">
  <title>LOUD JUICE BAR — 센서 테스트</title>
  <style>
    :root { color-scheme: dark; --bg:#111827; --panel:#1f2937; --muted:#9ca3af; --lime:#bef264; --blue:#38bdf8; }
    * { box-sizing:border-box; } body { margin:0; min-height:100svh; padding:18px 16px 30px; background:radial-gradient(ellipse at 50% 12%,#25324a,var(--bg) 66%); color:#f9fafb; font:16px/1.4 system-ui,-apple-system,"Noto Sans KR",sans-serif; }
    main { width:min(100%,480px); margin:auto; } h1 { margin:0; font-size:22px; letter-spacing:.04em; } .sub { color:var(--muted); margin:4px 0 16px; font-size:13px; }
    .row { display:flex; gap:10px; } button { border:0; border-radius:12px; padding:13px 15px; background:var(--lime); color:#17200b; font-weight:800; font-size:15px; cursor:pointer; touch-action:manipulation; } button.secondary { background:#374151; color:white; } button:disabled { opacity:.5; }
    .status { margin:12px 0; border:1px solid #374151; border-radius:12px; padding:10px 12px; color:#d1d5db; font-size:13px; min-height:42px; }
    .stage { min-height:320px; display:grid; place-items:center; position:relative; overflow:hidden; border-radius:20px; background:linear-gradient(#1b2638,#101722); }
    .readouts { position:absolute; inset:12px 14px auto; display:flex; justify-content:space-between; z-index:2; color:#cbd5e1; font-size:12px; }
    .shaker { width:156px; height:244px; position:relative; filter:drop-shadow(0 14px 18px #0008); }
    .lid { position:absolute; top:0; left:27px; width:102px; height:21px; border:2px solid #dbeafe88; border-radius:9px 9px 4px 4px; background:#94a3b855; z-index:3; }
    .jar { position:absolute; inset:16px 11px 3px; overflow:hidden; border:3px solid #dbeafe9c; border-top:1px solid #dbeafe55; border-radius:15px 15px 34px 34px; background:linear-gradient(90deg,#ffffff17,#ffffff06 35%,#ffffff12 75%,#ffffff25); }
    .jar:before,.jar:after { content:""; position:absolute; z-index:2; top:18px; bottom:20px; width:5px; border-radius:8px; background:#fff2; } .jar:before{left:12px}.jar:after{right:12px;width:3px;background:#fff3}
    .juice { position:absolute; left:-16%; right:-16%; bottom:0; height:70%; overflow:hidden; background:linear-gradient(180deg,#7dd3fcdd,#0ea5e9ed 38%,#075985ed); border-top:3px solid #bae6fd; border-radius:48% 48% 0 0 / 9% 9% 0 0; transform:translateX(var(--slosh-x,0px)) rotate(var(--slosh-r,0deg)); transform-origin:50% 100%; transition:height .2s ease-out,transform .1s ease-out; }
    .juice:before { content:""; position:absolute; left:-10%; top:-13px; width:120%; height:26px; border-radius:50%; background:#e0f2fea8; }
    .bubbles { position:absolute; inset:0; opacity:.55; background:radial-gradient(circle at 28% 68%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 72% 49%,#fff8 0 3px,transparent 4px),radial-gradient(circle at 48% 82%,#fff8 0 2px,transparent 3px); }
    .big { text-align:center; } .big .label { color:var(--muted); font-size:12px; letter-spacing:.14em; } .count { font-size:54px; font-weight:900; line-height:1.05; font-variant-numeric:tabular-nums; } .count small { font-size:15px; color:#cbd5e1; letter-spacing:.08em; }
    .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; } .metric { padding:10px; border-radius:12px; background:#ffffff0b; text-align:center; } .metric span { display:block; color:var(--muted); font-size:11px; } .metric b { font-size:14px; font-variant-numeric:tabular-nums; }
    details { margin-top:13px; background:#ffffff08; border-radius:12px; padding:11px 13px; } summary { cursor:pointer; font-weight:700; font-size:14px; } .controls { display:grid; grid-template-columns:1fr auto; gap:9px 12px; align-items:center; margin-top:12px; font-size:13px; color:#d1d5db; } input[type=range] { width:100%; accent-color:var(--lime); } output { min-width:47px; text-align:right; color:var(--lime); font-variant-numeric:tabular-nums; }
    .log { margin-top:12px; padding:10px; min-height:56px; max-height:110px; overflow:auto; border-radius:10px; background:#0003; color:#9ca3af; font:11px/1.5 ui-monospace,monospace; white-space:pre-wrap; }
    .hint { color:#9ca3af; font-size:12px; margin:12px 2px; }
    @media (max-height:730px) { .stage{min-height:260px}.shaker{transform:scale(.9)} }
  </style>
</head>
<body>
<main>
  <h1>LOUD JUICE BAR</h1><p class="sub">센서 프로토타입 v0.5.1 · 전축 SHAKE / 액체 반응</p>
  <div class="row"><button id="start">센서 시작</button><button id="reset" class="secondary">RESET</button></div>
  <div id="status" class="status">센서 시작을 눌러 모션 권한을 허용하세요. HTTPS 페이지에서만 센서가 동작합니다.</div>
  <section class="stage" aria-label="흔들림 및 액체 미리보기">
    <div class="readouts"><span id="mode">READY</span><span>전축 모션 감지</span></div>
    <div class="shaker" id="shaker"><div class="lid"></div><div class="jar"><div class="juice" id="juice"><div class="bubbles"></div></div></div></div>
    <div class="big"><div class="label">SHAKE</div><div class="count"><span id="count">0</span> <small>회</small></div></div>
  </section>
  <div class="metrics"><div class="metric"><span>감지 가속도</span><b id="peakRead">0.0 m/s²</b></div><div class="metric"><span>센서 주기</span><b id="rateRead">—</b></div><div class="metric"><span>왕복 판정</span><b>1회당 1카운트</b></div></div>
  <details open><summary>센서 튜닝</summary>
    <div class="controls">
      <label for="threshold">SHAKE 최소 가속도</label><output id="thresholdOut">5.5</output><input id="threshold" type="range" min="3" max="16" step="0.5" value="5.5">
      <label for="cooldown">왕복 최소 간격</label><output id="cooldownOut">300 ms</output><input id="cooldown" type="range" min="180" max="800" step="20" value="300">
    </div>
  </details>
  <div class="row" style="margin-top:12px"><button id="sound" class="secondary">진동: 켬</button></div>
  <p class="hint">폰을 원하는 방향으로 흔들어 보세요. X·Y·Z 모든 축의 모션을 감지하고, 흔든 뒤 돌아오는 한 왕복을 1회로 셉니다. 가만히 들고 있을 때의 중력은 계산에서 뺍니다.</p>
  <pre class="log" id="log">센서 로그가 여기에 표시됩니다.</pre>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const start=$('start'), reset=$('reset'), status=$('status'), juice=$('juice');
  let count=0, enabled=false, haptics=true;
  let lastCountAt=0,lastPeak=0,lastEventAt=0,lastMotionAt=0,sampleIntervals=[];
  let gravity={x:0,y:0,z:0},gravityReady=false,impactArmed=true,pendingPeakAt=0;
  let lastUi=0,logLines=[];
  const cfg={threshold:+$('threshold').value,cooldown:+$('cooldown').value};
  function say(text){ status.textContent=text; }
  function log(text){ logLines.unshift(new Date().toLocaleTimeString()+"  "+text); logLines=logLines.slice(0,7); $('log').textContent=logLines.join('\n'); }
  function haptic(pattern){ if(haptics && navigator.vibrate) navigator.vibrate(pattern); }
  function setCount(n){count=n;$('count').textContent=n;}
  function resetAll(){setCount(0);lastCountAt=0;lastPeak=0;lastMotionAt=0;sampleIntervals=[];gravityReady=false;impactArmed=true;pendingPeakAt=0;lastEventAt=0;juice.style.setProperty('--slosh-x','0px');juice.style.setProperty('--slosh-r','0deg');$('mode').textContent=enabled?'READY':'OFFLINE';log('RESET');}
  function onMotion(e){
    const ag=e.accelerationIncludingGravity, linear=e.acceleration;
    if(!ag && !linear)return;
    const now=performance.now();
    let ax,ay,az;
    if(linear && linear.x!=null && linear.y!=null && linear.z!=null){
      ax=linear.x;ay=linear.y;az=linear.z;
    }else if(ag && ag.x!=null && ag.y!=null && ag.z!=null){
      if(!gravityReady){gravity={x:ag.x,y:ag.y,z:ag.z};gravityReady=true;}
      const alpha=.08;
      gravity.x+=alpha*(ag.x-gravity.x);gravity.y+=alpha*(ag.y-gravity.y);gravity.z+=alpha*(ag.z-gravity.z);
      ax=ag.x-gravity.x;ay=ag.y-gravity.y;az=ag.z-gravity.z;
    }else return;
    // Combine all three linear acceleration axes so any natural shake direction counts.
    const magnitude=Math.hypot(ax,ay,az);
    if(lastMotionAt){sampleIntervals.push(now-lastMotionAt);sampleIntervals=sampleIntervals.slice(-12);}
    lastMotionAt=now;lastEventAt=now;lastPeak=Math.max(magnitude,lastPeak*.9);
    if(pendingPeakAt && now-pendingPeakAt>1000)pendingPeakAt=0;
    if(magnitude<cfg.threshold*.4)impactArmed=true;
    if(impactArmed && magnitude>=cfg.threshold){
      impactArmed=false;
      if(pendingPeakAt && now-pendingPeakAt>=120 && now-pendingPeakAt<=1000){
        if(!lastCountAt || now-lastCountAt>=cfg.cooldown){setCount(count+1);$('mode').textContent='SHAKE';lastCountAt=now;haptic(18);log(`SHAKE ${count} · 두 번째 피크 ${magnitude.toFixed(1)} m/s²`);}
        pendingPeakAt=0;
      }else pendingPeakAt=now;
    }
    const visual=Math.max(-12,Math.min(12,-ax*1.2));
    juice.style.setProperty('--slosh-x',visual.toFixed(1)+'px');
    juice.style.setProperty('--slosh-r',Math.max(-9,Math.min(9,(-ay-az)*.3)).toFixed(1)+'deg');
  }
  async function requestSensors(){
    try{
      const requests=[];
      if(typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function') requests.push(DeviceMotionEvent.requestPermission());
      const perms=await Promise.all(requests);
      if(perms.some(p=>p!=='granted')) throw new Error('센서 권한이 거부되었습니다. 브라우저 사이트 설정에서 모션/동작 권한을 허용하세요.');
      if(!('DeviceMotionEvent' in window)) throw new Error('이 브라우저에서 모션 센서를 지원하지 않습니다. Android Chrome을 사용하세요.');
      window.addEventListener('devicemotion',onMotion,{passive:true});
      enabled=true;start.disabled=true;start.textContent='센서 작동 중';say('센서가 연결됐어요. 폰을 편한 방향으로 흔들어 보세요.');$('mode').textContent='READY';log('센서 연결 완료');
    }catch(err){say((location.protocol!=='https:' && location.hostname!=='localhost'?'HTTPS가 필요합니다. ': '')+(err.message||'센서를 시작하지 못했습니다.'));log('오류: '+(err.message||err));}
  }
  start.addEventListener('click',requestSensors);reset.addEventListener('click',resetAll);
  $('sound').addEventListener('click',()=>{haptics=!haptics;$('sound').textContent='진동: '+(haptics?'켬':'끔');if(haptics)haptic(20);});
  for(const [id,key,out,format] of [
    ['threshold','threshold','thresholdOut',v=>Number(v).toFixed(1)],['cooldown','cooldown','cooldownOut',v=>v+' ms']
  ]) $(id).addEventListener('input',e=>{cfg[key]=+e.target.value;$(out).textContent=format(e.target.value);});
  function frame(now){
    if(now-lastEventAt>130){juice.style.setProperty('--slosh-x','0px');juice.style.setProperty('--slosh-r','0deg');}
    if(now-lastUi>250){$('peakRead').textContent=lastPeak.toFixed(1)+' m/s²';lastPeak*=.65;
      if(sampleIntervals.length){const avg=sampleIntervals.reduce((a,b)=>a+b,0)/sampleIntervals.length;$('rateRead').textContent=Math.round(1000/avg)+' Hz';}lastUi=now;}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
